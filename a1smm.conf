server {
    listen 80;
    server_name a1smm.store www.a1smm.store;

    # Redirect HTTP → HTTPS (يتفعل بعد certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name a1smm.store www.a1smm.store;

    # SSL (certbot يملأها تلقائياً)
    ssl_certificate     /etc/letsencrypt/live/a1smm.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a1smm.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static files
    location /static/ {
        alias /root/a1smm/website/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy → Flask
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
