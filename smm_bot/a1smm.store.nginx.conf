##
## /etc/nginx/sites-available/a1smm.store
## لتفعيله:
##   ln -s /etc/nginx/sites-available/a1smm.store /etc/nginx/sites-enabled/
##   certbot --nginx -d a1smm.store -d www.a1smm.store
##   nginx -s reload
##

server {
    listen 80;
    server_name a1smm.store www.a1smm.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name a1smm.store www.a1smm.store;

    # شهادة SSL (certbot سيملأ هذا تلقائياً)
    # ssl_certificate     /etc/letsencrypt/live/a1smm.store/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/a1smm.store/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── حدود الطلبات ──
    client_max_body_size 2m;

    # ── Proxy لـ Flask ──
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Static files (اختياري مستقبلاً) ──
    location /static/ {
        alias /root/smmbot-main/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Security headers ──
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin" always;

    # ── Logs ──
    access_log /var/log/nginx/a1smm_access.log;
    error_log  /var/log/nginx/a1smm_error.log;
}
